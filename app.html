<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مولّدتي — إدارة اشتراكات المولدة</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <svg viewBox="0 0 24 24" class="ico fill" aria-hidden="true"><path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12l1-8Z"/></svg>
        <span>مولّدتي</span>
      </a>
      <p class="gen-name" id="genName"></p>
      <nav id="nav" aria-label="القائمة الرئيسية"></nav>
      <div class="side-foot">
        <div class="who"><b id="userName"></b><small id="userEmail"></small></div>
        <button class="btn ghost-dark sm" id="logoutBtn" type="button">تسجيل الخروج</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main-col">
      <header class="topbar">
        <button id="menuBtn" class="icon-btn" type="button" aria-label="فتح القائمة">
          <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <span class="topbar-title" id="topTitle">مولّدتي</span>
      </header>
      <main id="view" class="main" tabindex="-1"></main>
    </div>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
